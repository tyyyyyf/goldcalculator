
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#382814">
<title>黃金計算機</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:10px 15px;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;
  background:linear-gradient(145deg,#21190c,#5a421d,#21190c);
  color:#fff8e8;
  min-height:100vh;
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.container{
  width:100%;
  max-width:480px;
  margin:0 auto;
  padding:18px 20px;
  border-radius:22px;
  background:linear-gradient(145deg,#3b2b16,#21190e);
  border:1px solid #b9954b;
  box-shadow:0 10px 35px #0008;
}

h1{
  text-align:center;
  color:#e8c878;
  margin:5px 0 8px;
}

.subtitle{
  text-align:center;
  color:#cbb98e;
  font-size:13px;
  margin-bottom:14px;
}

label{
  display:block;
  margin:11px 0 6px;
  color:#e8d5a6;
  font-size:14px;
}

input{
  width:100%;
  padding:11px 14px;
  border-radius:10px;
  border:1px solid #9b7940;
  background:#fffaf0;
  color:#30220e;
  font-size:18px;
  outline:none;
}

input:focus{
  border-color:#f0cf75;
  box-shadow:0 0 0 2px #d6ad5140;
}

.unit-row{
  display:flex;
  gap:9px;
  align-items:center;
}

.unit-row input{
  flex:1;
  min-width:0;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  background:linear-gradient(135deg,#f0d58e,#bd8b35);
  color:#38250b;
  font-weight:bold;
  font-size:14px;
  cursor:pointer;
  white-space:nowrap;
}

.convert{
  margin-top:8px;
  padding:9px 12px;
  border-radius:10px;
  background:#ffffff0d;
  color:#e9d5a5;
  font-size:14px;
  line-height:1.6;
}

.calculate{
  width:100%;
  margin-top:15px;
  padding:13px;
  font-size:17px;
  border-radius:12px;
}

.result{
  display:none;
  margin-top:13px;
  padding:12px 18px;
  border-radius:14px;
  background:#fff9e9;
  color:#3c2a10;
}

.result h2{
  text-align:center;
  color:#94691f;
  margin:0 0 8px;
}

.result-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:7px 0;
  border-bottom:1px solid #e7d9b8;
  font-size:14px;
}

.result-row strong{
  text-align:right;
}

.result-row.total{
  border:0;
  font-size:19px;
  font-weight:bold;
  color:#94691f;
}

.note{
  text-align:center;
  font-size:12px;
  color:#c9b88e;
  margin-top:11px;
}

/* 手機高度調整：維持原本風格，避免上下滑動 */
@media screen and (max-height:750px){
  body{
    padding:6px 12px;
  }

  .container{
    padding:12px 18px;
  }

  .subtitle{
    margin-bottom:9px;
  }

  label{
    margin:8px 0 5px;
  }

  input{
    padding:9px 12px;
  }

  button{
    padding:10px 13px;
  }

  .convert{
    margin-top:6px;
    padding:7px 10px;
    line-height:1.5;
  }

  .calculate{
    margin-top:11px;
    padding:11px;
  }

  .result{
    margin-top:9px;
    padding:9px 14px;
  }

  .result h2{
    margin-bottom:5px;
  }

  .result-row{
    padding:5px 0;
  }

  .note{
    margin-top:7px;
  }
}

/* 螢幕較矮時進一步壓縮間距 */
@media screen and (max-height:650px){
  body{
    padding:4px 10px;
  }

  .container{
    padding:9px 16px;
  }

  h1{
    margin:2px 0 5px;
  }

  .subtitle{
    margin-bottom:6px;
  }

  label{
    margin:6px 0 4px;
  }

  input{
    padding:7px 12px;
  }

  .convert{
    padding:5px 10px;
    line-height:1.4;
  }

  .calculate{
    margin-top:8px;
    padding:9px;
  }

  .result{
    margin-top:7px;
    padding:7px 12px;
  }

  .result-row{
    padding:4px 0;
  }

  .note{
    margin-top:5px;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>✦ 黃金計算機 ✦</h1>
  <div class="subtitle">Gold Price Calculator</div>

  <label for="goldPrice">今日金價（元／錢）</label>
  <input
    id="goldPrice"
    type="number"
    inputmode="decimal"
    placeholder="請輸入今日金價"
    step="any"
  >

  <label for="weightInput">黃金重量</label>

  <div class="unit-row">
    <input
      id="weightInput"
      type="number"
      inputmode="decimal"
      placeholder="請輸入克數"
      step="any"
    >
    <button
      type="button"
      id="switchButton"
      onclick="switchUnit()"
    >切換為錢</button>
  </div>

  <div class="convert" id="conversion">
    換算重量：0.000 克<br>
    換算重量：0.000 錢
  </div>

  <label for="totalPrice">商品總價（元）</label>
  <input
    id="totalPrice"
    type="number"
    inputmode="decimal"
    placeholder="可留空，留空則工錢為 0"
    step="any"
  >

  <button
    type="button"
    class="calculate"
    onclick="calculate()"
  >計算黃金金額與工錢</button>

  <div class="result" id="result">

    <h2>計算明細</h2>

    <div class="result-row">
      <span>今日金價</span>
      <strong id="rPrice"></strong>
    </div>

    <div class="result-row">
      <span>黃金重量</span>
      <strong id="rWeight"></strong>
    </div>

    <div class="result-row">
      <span>黃金本金</span>
      <strong id="rGold"></strong>
    </div>

    <div class="result-row">
      <span>黃金工錢</span>
      <strong id="rLabor"></strong>
    </div>

    <div class="result-row total">
      <span>商品總價</span>
      <strong id="rTotal"></strong>
    </div>

  </div>

  <div class="note">
  換算基準：1 錢 = 3.75 克｜1 克 = 0.2667 錢
  </div>

</div>

<script>

// ==============================
// 黃金重量換算設定
// ==============================

let unit = "克";

const GRAMS_PER_QIAN = 3.75;

// 直接捨去至小數點後第三位，不四捨五入
function truncate3(value){
  return Math.floor(value * 1000) / 1000;
}

// ==============================
// 取得重量
// ==============================

const weightInput = document.getElementById("weightInput");
const switchButton = document.getElementById("switchButton");
const conversion = document.getElementById("conversion");

function getGrams(){

  const value = Number(weightInput.value);

  if(!Number.isFinite(value) || value < 0){
    return 0;
  }

  if(unit === "克"){
    return value;
  }

  return value * GRAMS_PER_QIAN;
}

// 克換算錢：直接捨去第三位
function getQian(){

  const grams = getGrams();

  return truncate3(grams / GRAMS_PER_QIAN);
}

// ==============================
// 更新換算顯示
// ==============================

function updateConversion(){

  const grams = getGrams();
  const qian = getQian();

  conversion.innerHTML =
    "換算重量：" + grams.toFixed(3) + " 克<br>" +
    "換算重量：" + qian.toFixed(3) + " 錢";
}

// ==============================
// 克、錢單位切換
// ==============================

function switchUnit(){

  const grams = getGrams();

  if(unit === "克"){

    unit = "錢";

    weightInput.value = getQian().toFixed(3);
    weightInput.placeholder = "請輸入錢數";

    switchButton.textContent = "切換為克";

  }else{

    unit = "克";

    weightInput.value = grams.toFixed(3);
    weightInput.placeholder = "請輸入克數";

    switchButton.textContent = "切換為錢";
  }

  updateConversion();
}

weightInput.addEventListener("input", updateConversion);

// ==============================
// 金額計算
// ==============================

function calculate(){

  const priceInput = document.getElementById("goldPrice").value;
  const totalInput = document.getElementById("totalPrice").value;

  const goldPrice = Number(priceInput);

  // 總價可以留空
  if(priceInput === "" || weightInput.value === ""){

    alert("請輸入今日金價及黃金重量！");
    return;
  }

  if(
    !Number.isFinite(goldPrice) ||
    goldPrice < 0 ||
    getGrams() <= 0
  ){

    alert("請輸入有效的金價及重量！");
    return;
  }

  // 總價有填才檢查是否為有效數字
  if(totalInput !== "" &&
     (!Number.isFinite(Number(totalInput)) || Number(totalInput) < 0)){

    alert("請輸入有效的商品總價！");
    return;
  }

  // 使用捨去第三位後的錢數計算
  const qian = getQian();

  // 黃金本金 = 今日金價 × 重量（錢）
  const goldAmount = goldPrice * qian;

  let labor;
  let finalTotal;

  if(totalInput === ""){

    // 沒有輸入總價：工錢為 0
    labor = 0;

    // 商品總價自動等於黃金本金
    finalTotal = goldAmount;

  }else{

    // 有輸入總價：工錢 = 總價 - 黃金本金
    finalTotal = Number(totalInput);
    labor = finalTotal - goldAmount;

  }

  // 顯示今日金價
  document.getElementById("rPrice").textContent =
    "$" + goldPrice.toLocaleString("zh-TW") + "／錢";

  // 顯示重量
  document.getElementById("rWeight").textContent =
    qian.toFixed(3) + " 錢（" +
    getGrams().toFixed(3) + " 克）";

  // 顯示黃金本金
  document.getElementById("rGold").textContent =
    "$" + goldAmount.toLocaleString("zh-TW",{
      maximumFractionDigits:2
    });

  // 顯示工錢
  document.getElementById("rLabor").textContent =
    "$" + labor.toLocaleString("zh-TW",{
      maximumFractionDigits:2
    });

  // 顯示商品總價
  document.getElementById("rTotal").textContent =
    "$" + finalTotal.toLocaleString("zh-TW",{
      maximumFractionDigits:2
    });

  document.getElementById("result").style.display = "block";
}

// 初始顯示
updateConversion();

</script>

</body>
</html>
