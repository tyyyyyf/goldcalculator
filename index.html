
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黃金計算機</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:24px 15px;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;
  background:linear-gradient(145deg,#21190c,#5a421d,#21190c);
  color:#fff8e8;min-height:100vh;
}
.container{
  max-width:480px;margin:20px auto;
  padding:25px 20px;border-radius:22px;
  background:linear-gradient(145deg,#3b2b16,#21190e);
  border:1px solid #b9954b;
  box-shadow:0 10px 35px #0008;
}
h1{text-align:center;color:#e8c878;margin:5px 0 8px}
.subtitle{text-align:center;color:#cbb98e;font-size:13px;margin-bottom:25px}
label{display:block;margin:17px 0 8px;color:#e8d5a6;font-size:14px}
input{
  width:100%;padding:14px;border-radius:10px;
  border:1px solid #9b7940;background:#fffaf0;
  color:#30220e;font-size:18px;outline:none;
}
input:focus{border-color:#f0cf75;box-shadow:0 0 0 2px #d6ad5140}
.unit-row{display:flex;gap:9px;align-items:center}
.unit-row input{flex:1;min-width:0}
button{
  border:0;border-radius:10px;padding:13px 15px;
  background:linear-gradient(135deg,#f0d58e,#bd8b35);
  color:#38250b;font-weight:bold;font-size:14px;
  cursor:pointer;white-space:nowrap;
}
.convert{
  margin-top:10px;padding:12px;border-radius:10px;
  background:#ffffff0d;color:#e9d5a5;font-size:14px;line-height:1.8;
}
.calculate{
  width:100%;margin-top:24px;padding:16px;
  font-size:17px;border-radius:12px;
}
.result{
  display:none;margin-top:22px;padding:18px;
  border-radius:14px;background:#fff9e9;color:#3c2a10;
}
.result h2{text-align:center;color:#94691f;margin:0 0 15px}
.result-row{
  display:flex;justify-content:space-between;gap:12px;
  padding:11px 0;border-bottom:1px solid #e7d9b8;
  font-size:14px;
}
.result-row strong{text-align:right}
.result-row.total{
  border:0;font-size:19px;font-weight:bold;color:#94691f;
}
.note{text-align:center;font-size:12px;color:#c9b88e;margin-top:18px}
</style>
</head>

<body>
<div class="container">
  <h1>✦ 黃金計算機 ✦</h1>
  <div class="subtitle">Gold Price Calculator</div>

  <label for="goldPrice">今日金價（元／錢）</label>
  <input id="goldPrice" type="number" inputmode="decimal" placeholder="請輸入今日金價" step="any">

  <label for="weightInput">黃金重量</label>
  <div class="unit-row">
    <input id="weightInput" type="number" inputmode="decimal" placeholder="請輸入重量" step="any">
    <button type="button" id="switchButton" onclick="switchUnit()">切換為錢</button>
  </div>

  <div class="convert" id="conversion">
    換算重量：0.00 克<br>
    換算重量：0.00 錢
  </div>

  <label for="totalPrice">商品總價（元）</label>
  <input id="totalPrice" type="number" inputmode="decimal" placeholder="請輸入商品總價" step="any">

  <button type="button" class="calculate" onclick="calculate()">計算黃金金額與工錢</button>

  <div class="result" id="result">
    <h2>計算明細</h2>
    <div class="result-row">
      <span>今日金價</span><strong id="rPrice"></strong>
    </div>
    <div class="result-row">
      <span>黃金重量</span><strong id="rWeight"></strong>
    </div>
    <div class="result-row">
      <span>黃金本金</span><strong id="rGold"></strong>
    </div>
    <div class="result-row">
      <span>黃金工錢</span><strong id="rLabor"></strong>
    </div>
    <div class="result-row total">
      <span>商品總價</span><strong id="rTotal"></strong>
    </div>
  </div>

  <div class="note">換算基準：1 錢 = 3.75 克</div>
</div>

<script>
let unit = "克";

const weightInput = document.getElementById("weightInput");
const switchButton = document.getElementById("switchButton");
const conversion = document.getElementById("conversion");

function getWeight(){
  const value = Number(weightInput.value);
  if(!Number.isFinite(value) || value < 0) return 0;

  // 將目前輸入的重量換算成克
  return unit === "克" ? value : value * 3.75;
}

function getQian(){
  const grams = getWeight();
  // 錢數取小數點後第二位
  return Number((grams / 3.75).toFixed(2));
}

function updateConversion(){
  const grams = getWeight();
  const qian = getQian();

  conversion.innerHTML =
    "換算重量：" + grams.toFixed(2) + " 克<br>" +
    "換算重量：" + qian.toFixed(2) + " 錢";
}

function switchUnit(){
  const grams = getWeight();

  if(unit === "克"){
    unit = "錢";
    weightInput.value = (grams / 3.75).toFixed(2);
    weightInput.placeholder = "請輸入錢數";
    switchButton.textContent = "切換為克";
  }else{
    unit = "克";
    weightInput.value = grams.toFixed(2);
    weightInput.placeholder = "請輸入克數";
    switchButton.textContent = "切換為錢";
  }

  updateConversion();
}

weightInput.addEventListener("input", updateConversion);

function calculate(){
  const goldPrice = Number(document.getElementById("goldPrice").value);
  const totalPrice = Number(document.getElementById("totalPrice").value);

  if(document.getElementById("goldPrice").value === "" ||
     weightInput.value === "" ||
     document.getElementById("totalPrice").value === ""){
    alert("請完整輸入今日金價、黃金重量及商品總價！");
    return;
  }

  if(!Number.isFinite(goldPrice) || !Number.isFinite(totalPrice) ||
     goldPrice < 0 || totalPrice < 0 || getWeight() <= 0){
    alert("請輸入有效的數字！");
    return;
  }

  const qian = getQian();
  const goldAmount = goldPrice * qian;
  const labor = totalPrice - goldAmount;

  document.getElementById("rPrice").textContent =
    "$" + goldPrice.toLocaleString("zh-TW") + "／錢";

  document.getElementById("rWeight").textContent =
    qian.toFixed(2) + " 錢（" + getWeight().toFixed(2) + " 克）";

  document.getElementById("rGold").textContent =
    "$" + goldAmount.toLocaleString("zh-TW",{maximumFractionDigits:2});

  document.getElementById("rLabor").textContent =
    "$" + labor.toLocaleString("zh-TW",{maximumFractionDigits:2});

  document.getElementById("rTotal").textContent =
    "$" + totalPrice.toLocaleString("zh-TW",{maximumFractionDigits:2});

  document.getElementById("result").style.display = "block";
}

updateConversion();
</script>
</body>
</html>
